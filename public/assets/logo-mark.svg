<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="LANStreamer">
  <!--
    LANStreamer mark only (square app icon / favicon source).
    Reads on both dark and light backgrounds — the tile carries its own color.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00AEEF"/>
      <stop offset="1" stop-color="#0088CC"/>
    </linearGradient>
  </defs>

  <g id="mark">
    <rect x="0" y="0" width="96" height="96" rx="24" fill="url(#tile)"/>
    <path id="arc" d="M 60 26 A 22 22 0 0 1 74 40" fill="none"
          stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <g id="bars" fill="#FFFFFF">
      <rect x="28" y="54" width="9" height="18" rx="4.5"/>
      <rect x="45" y="38" width="9" height="34" rx="4.5"/>
      <rect x="62" y="48" width="9" height="24" rx="4.5"/>
    </g>
  </g>
</svg>
