<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 96" role="img" aria-label="LANStreamer">
  <!--
    LANStreamer logo (dark theme, light text).
    Editable source: mark (left) and wordmark (right). Colors reference the
    app design tokens: primary #00AEEF, gradient #00AEEF to #0088CC.
    For light backgrounds use logo-light.svg; mark alone in logo-mark.svg.
    Wordmark uses a font stack; embed Inter as a path if pixel-exact
    reproduction inside img tags is ever needed.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00AEEF"/>
      <stop offset="1" stop-color="#0088CC"/>
    </linearGradient>
  </defs>

  <!-- ===================== Mark ===================== -->
  <g id="mark">
    <rect x="0" y="0" width="96" height="96" rx="24" fill="url(#tile)"/>
    <!-- broadcast arc above the tallest bar -->
    <path id="arc" d="M 60 26 A 22 22 0 0 1 74 40" fill="none"
          stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <!-- equalizer bars -->
    <g id="bars" fill="#FFFFFF">
      <rect x="28" y="54" width="9" height="18" rx="4.5"/>
      <rect x="45" y="38" width="9" height="34" rx="4.5"/>
      <rect x="62" y="48" width="9" height="24" rx="4.5"/>
    </g>
  </g>

  <!-- ===================== Wordmark ===================== -->
  <g id="wordmark" fill="#FFFFFF"
     font-family="Inter, 'Segoe UI', 'Noto Sans', Arial, sans-serif">
    <text id="word-lan" x="120" y="62" font-size="44" font-weight="800" letter-spacing="0.5">LAN</text>
    <text id="word-streamer" x="220" y="62" font-size="44" font-weight="400" fill="#E6F7FE">Streamer</text>
  </g>
</svg>
